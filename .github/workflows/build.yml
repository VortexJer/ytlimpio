name: Compilar app

# Se lanza en cada push y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    # Runner de macOS: gratis y sin límite de minutos en repositorios públicos.
    # macos-15 porque trae Xcode 16: XcodeGen genera el proyecto en el formato
    # nuevo (objectVersion 77) y el Xcode de macos-14 no sabe abrirlo.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Usar el Xcode más nuevo del runner
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Versiones (para cuando algo falle)
        run: |
          xcodegen --version
          xcodebuild -version

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild \
            -project YTLimpio.xcodeproj \
            -scheme YTLimpio \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar el .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/YTLimpio.app"
          test -d "$APP" || { echo "No se generó la app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YTLimpio.ipa Payload
          echo "Tamaño: $(du -h YTLimpio.ipa | cut -f1)"

      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: YTLimpio-ipa
          path: YTLimpio.ipa
          retention-days: 90
